openapi: 3.0.3
info:
  title: Social Network API - Authentication và Posts
  version: 1.0.0
  description: >-
    Hợp đồng dự kiến cho đăng nhập, làm mới token và đọc một bài viết.
    Đây là thiết kế bài tập, chưa xác nhận backend hiện tại thực hiện hợp đồng này.
    Quyền đọc bài được giới hạn cho tác giả hoặc admin và còn yêu cầu scope posts:read.
    Thông tin nhạy cảm và token trong các ví dụ đều là dữ liệu minh họa.
servers:
  - url: http://localhost:5000/api/v1
    description: Địa chỉ phát triển cục bộ dự kiến; môi trường thực tế phải dùng HTTPS.
tags:
  - name: auth
    description: Đăng nhập và làm mới phiên.
  - name: posts
    description: Truy cập bài viết theo chính sách phân quyền.
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Đăng nhập và cấp cặp token
      operationId: login
      description: >-
        Không yêu cầu token hoặc scope. Nhận email và password; server xác thực
        thông tin đăng nhập và quyết định roles, scopes theo chính sách hiện tại,
        không nhận quyền do client tự chọn. Với tài khoản không tồn tại, mật khẩu
        sai hoặc tài khoản không được phép đăng nhập, trả cùng lỗi 401 chung.
        Phản hồi chứa credential nên không được lưu vào cache.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: an@example.com
              password: example-password
      responses:
        '200':
          $ref: '#/components/responses/TokenPairResponse'
        '400':
          $ref: '#/components/responses/InvalidLoginRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/refresh:
    post:
      tags: [auth]
      summary: Làm mới cặp token
      operationId: refreshTokens
      description: >-
        Yêu cầu refresh token JWT hợp lệ trong Authorization: Bearer; không yêu cầu
        scope hành động. Access token không được chấp nhận tại endpoint này.
        Server kiểm tra chữ ký, thời hạn, loại token và trạng thái phiên/thu hồi;
        lấy quyền hiện tại, cấp cặp token mới và vô hiệu refresh token cũ trong
        cùng một giao dịch. Token cũ đã dùng lại bị từ chối; client phải lưu
        refresh token mới và không gửi đồng thời nhiều yêu cầu dùng token cũ.
        Không yêu cầu request body. Không cache phản hồi chứa token.
      security:
        - refreshBearer: []
      responses:
        '200':
          $ref: '#/components/responses/TokenPairResponse'
        '401':
          $ref: '#/components/responses/InvalidBearerToken'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /posts/{id}:
    get:
      tags: [posts]
      summary: Đọc một bài viết
      operationId: getPostById
      description: >-
        Yêu cầu access token JWT hợp lệ có scope posts:read. Refresh token không
        được chấp nhận. Sau khi xác thực, server kiểm tra scope; chỉ tác giả của
        bài hoặc user có role admin được đọc bài. Admin vẫn cần scope posts:read.
        Với token và scope hợp lệ, trả 404 nếu bài không tồn tại và 403 nếu bài
        tồn tại nhưng user không có quyền. Quy ước này có thể tiết lộ sự tồn tại
        của bài; đây là lựa chọn thiết kế cần được review.
      parameters:
        - $ref: '#/components/parameters/PostId'
      security:
        - accessBearer: []
      responses:
        '200':
          $ref: '#/components/responses/PostResponse'
        '400':
          $ref: '#/components/responses/InvalidPostId'
        '401':
          $ref: '#/components/responses/InvalidBearerToken'
        '403':
          $ref: '#/components/responses/PostForbidden'
        '404':
          $ref: '#/components/responses/PostNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
components:
  securitySchemes:
    accessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token trong header Authorization: Bearer <token>. GET /posts/{id}
        còn yêu cầu scope posts:read và chính sách quyền đối tượng. HTTP bearer
        scheme không thể khai báo scope bằng security requirement của OpenAPI;
        server phải kiểm tra scope và quyền theo mô tả operation.
    refreshBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Refresh token trong header Authorization: Bearer <token>, chỉ dùng để
        làm mới phiên. Server phải phân biệt và từ chối access token tại refresh.
  parameters:
    PostId:
      name: id
      in: path
      required: true
      description: Mã bài viết; số nguyên thập phân lớn hơn hoặc bằng 1.
      schema:
        type: integer
        minimum: 1
      example: 42
  schemas:
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: Email đăng nhập của tài khoản.
          example: an@example.com
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
          description: Mật khẩu tài khoản; không ghi vào log hoặc trả lại trong phản hồi.
          example: example-password
    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          minLength: 1
          description: JWT dùng để gọi endpoint yêu cầu access token.
          example: example-access-token
        refresh_token:
          type: string
          minLength: 1
          description: JWT dùng một lần để làm mới cặp token.
          example: example-refresh-token
        token_type:
          type: string
          enum: [Bearer]
          description: Loại credential dùng trong header Authorization.
          example: Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Thời gian còn hiệu lực của access token tính bằng giây từ lúc cấp.
          example: 900
    Post:
      type: object
      additionalProperties: false
      required: [id, title, content, status, author_id]
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
          description: Mã định danh bài viết.
          example: 42
        title:
          type: string
          maxLength: 200
          description: Tiêu đề bài viết.
          example: Bảo vệ API
        content:
          type: string
          description: Nội dung bài viết.
          example: Giới thiệu xác thực và phân quyền.
        status:
          type: string
          maxLength: 20
          description: Trạng thái bài viết; các giá trị cụ thể do nghiệp vụ quyết định.
          example: draft
        author_id:
          type: integer
          minimum: 1
          description: Mã định danh tác giả sở hữu bài viết.
          example: 7
    Error:
      type: object
      required: [status, title]
      properties:
        type:
          type: string
          format: uri
          description: URI định danh loại lỗi; about:blank dùng tên HTTP chuẩn.
          example: about:blank
        title:
          type: string
          description: Mô tả ngắn gọn loại lỗi.
          example: Bad Request
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Mã trạng thái HTTP, phải khớp mã thực tế của phản hồi.
          example: 400
        detail:
          type: string
          description: Chi tiết an toàn cho client, không chứa credential hoặc thông tin nội bộ.
          example: Mã bài viết phải là số nguyên lớn hơn hoặc bằng 1.
        instance:
          type: string
          format: uri-reference
          description: URI tham chiếu đến lần xảy ra lỗi; có thể là đường dẫn yêu cầu.
          example: /api/v1/posts/0
  headers:
    NoStore:
      description: Ngăn cache lưu phản hồi chứa token.
      schema:
        type: string
        enum: [no-store]
      example: no-store
    BearerChallenge:
      description: Challenge cho yêu cầu thiếu hoặc có bearer token không hợp lệ.
      schema:
        type: string
      example: Bearer
    RetryAfter:
      description: Số giây client cần chờ trước khi thử lại.
      schema:
        type: integer
        minimum: 1
      example: 60
  responses:
    TokenPairResponse:
      description: Cấp cặp token thành công; refresh token trước đó bị vô hiệu nếu đây là yêu cầu refresh.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenPair'
          example:
            access_token: example-access-token
            refresh_token: example-refresh-token
            token_type: Bearer
            expires_in: 900
    PostResponse:
      description: Bài viết mà user được phép đọc.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Post'
          example:
            id: 42
            title: Bảo vệ API
            content: Giới thiệu xác thực và phân quyền.
            status: draft
            author_id: 7
    InvalidLoginRequest:
      description: >-
        Body thiếu, JSON sai cú pháp, không phải object, thiếu trường bắt buộc,
        sai kiểu hoặc không đáp ứng ràng buộc; không tiết lộ password trong lỗi.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Email và password là bắt buộc và phải đúng định dạng.
            instance: /api/v1/auth/login
    InvalidPostId:
      description: ID không phải số nguyên thập phân hợp lệ hoặc nhỏ hơn 1.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Mã bài viết phải là số nguyên lớn hơn hoặc bằng 1.
            instance: /api/v1/posts/0
    InvalidCredentials:
      description: Thông tin đăng nhập không hợp lệ hoặc tài khoản không được phép đăng nhập; dùng thông báo chung.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Không thể đăng nhập với thông tin đã cung cấp.
            instance: /api/v1/auth/login
    InvalidBearerToken:
      description: >-
        Thiếu token, sai định dạng, sai loại, chữ ký không hợp lệ, hết hạn,
        chưa có hiệu lực, sai issuer hoặc audience, hay token/phiên đã bị thu hồi.
        Không tiết lộ token hoặc chi tiết nhạy cảm trong phản hồi.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/BearerChallenge'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Token xác thực thiếu hoặc không hợp lệ.
            instance: /api/v1/posts/42
    PostForbidden:
      description: Access token hợp lệ nhưng thiếu scope posts:read hoặc user không có quyền đối với bài.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: Bạn không có quyền thực hiện yêu cầu này.
            instance: /api/v1/posts/42
    PostNotFound:
      description: Không có bài viết với ID được yêu cầu.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Không tìm thấy bài viết được yêu cầu.
            instance: /api/v1/posts/42
    UnsupportedMediaType:
      description: Content-Type của yêu cầu login không phải application/json.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Unsupported Media Type
            status: 415
            detail: Yêu cầu phải dùng Content-Type application/json.
            instance: /api/v1/auth/login
    RateLimited:
      description: Vượt giới hạn yêu cầu theo chính sách của server; có thể thử lại sau thời gian chỉ định.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Quá nhiều yêu cầu; vui lòng thử lại sau.
            instance: /api/v1/auth/login
    UnexpectedError:
      description: >-
        Các lỗi khác chưa khai báo cụ thể, ví dụ lỗi nội bộ 500. status trong
        body phải khớp status HTTP thực tế; không trả stack trace hay bí mật.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: Máy chủ không thể xử lý yêu cầu.
            instance: /api/v1/auth/login
