openapi: 3.0.3
info:
  title: Products API
  version: 1.0.0
  description: Minimal Design-First version of the Product API.
servers:
  - url: http://localhost:5002
paths:
  /products:
    get:
      operationId: api.products.list_products
      summary: List products
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      operationId: api.products.create_product
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductIn'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Request body failed parsing or schema validation
components:
  schemas:
    ProductIn:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        price:
          type: number
          minimum: 0
        description:
          type: string
          default: ''
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductIn'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              readOnly: true
